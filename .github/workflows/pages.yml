# FLIPERAMA's site on GitHub Pages: https://saulofilho.github.io/fliperama-fm1/
# Turn it on once: the repository's Settings > Pages > Source: GitHub Actions.
# It publishes site/ as it is, with the mood board at moodboard/.
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/moodboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Put the site together
        run: |
          mkdir -p _site/moodboard
          cp -R site/. _site/
          cp docs/moodboard/index.html _site/moodboard/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
