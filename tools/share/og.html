<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The link-preview image (1200x630): tools/share/make.sh prints it to site/og.png with headless Chrome.
     The three screens are the site's own cabinets (site/arcade.js) in attract mode. -->
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@700&family=Share+Tech+Mono&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;color:#E9E1FF;font-family:"Chakra Petch",sans-serif;
  background:radial-gradient(900px 600px at 85% -20%,#4B1F86 0,transparent 60%),radial-gradient(700px 500px at -10% 110%,#2B1360 0,transparent 60%),#120A2A}
.hud{font:400 18px "Share Tech Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#A497D6}
.left{position:absolute;left:64px;top:64px;width:640px}
.word{margin:16px 0 0;font:400 92px/.95 Audiowide,sans-serif;transform:skewX(-14deg);transform-origin:left bottom;
  background:linear-gradient(180deg,#FFD6F4 0%,#F6A8E4 30%,#E04FD0 62%,#8E3BD8 100%);-webkit-background-clip:text;color:transparent;
  -webkit-mask-image:linear-gradient(180deg,#000 0 58%,transparent 58% 62%,#000 62% 71%,transparent 71% 75%,#000 75% 83%,transparent 83% 87%,#000 87%)}
.tag{margin:26px 0 0;font:700 40px/1.15 "Chakra Petch",sans-serif;color:#F3E6C8}
.url{position:absolute;left:64px;bottom:52px}
.url b{color:#F6A8E4;font-weight:400}
.frame{position:absolute;right:56px;top:56px;width:440px;height:518px;border:1px solid #5B4A9A;background:rgba(46,26,99,.45)}
.frame::before,.frame::after{content:"";position:absolute;width:26px;height:26px;border:3px solid #F6A8E4}
.frame::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.frame::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
#salao{position:absolute;inset:22px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.gab{display:none}
.gab:nth-child(1),.gab:nth-child(3),.gab:nth-child(6){display:block}
.gab:nth-child(6){grid-column:1/-1;grid-row:1;justify-self:center;width:250px}
.marquee,.info,.coin{display:none}
.tube{padding:6px;background:#06040E;border:1px solid #3A2C70;border-radius:12px}
.screen{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1}
.screen canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#hidden{display:none}
</style>
</head>
<body>
<div class="left">
  <div class="hud">M-VAVE FM-1 // Firmware // FM-1_939</div>
  <div class="word">FLIPERAMA</div>
  <div class="tag">The music plays the game.</div>
</div>
<div class="url hud"><b>saulofilho.github.io</b>/fliperama-fm1</div>
<div class="frame"><div id="salao"></div></div>
<div id="hidden"><button id="motion"></button><span id="status"></span><div id="teclado"><span id="teclado-l"></span><div id="keys"></div></div></div>
<script src="../../site/arcade.js"></script>
</body>
</html>
